<!DOCTYPE html>
<html>
<head>
    <title>Login - BookHub</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .login-box {
            width: 500px;
            margin: 70px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            margin: 18px 0;
            align-items: center;
        }

        label {
            width: 170px;
            font-size: 18px;
        }

        input {
            width: 200px;
            height: 28px;
            border: 2px solid black;
        }

        .buttons {
            text-align: center;
            margin-top: 35px;
        }

        button {
            padding: 10px 25px;
            margin: 0 15px;
            font-size: 16px;
            background-color: white;
            border: 2px solid #555;
            cursor: pointer;
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            background-color: #f6c18b;
            font-size: 14px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login Page</h2>

        <div class="row">
            <label>User Name:</label>
            <input type="text">
        </div>

        <div class="row">
            <label>Password:</label>
            <input type="password">
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </div>

    <footer>
         Samiksha     |     2501920110327         
         <p>Github repo URL: <a href="https://github.com/samiksha-171/book-store" target="_blank"> Github</a> </p>         
         Live Website: <a href="https://book-store-git-main-web-dev-a7e6.vercel.app/" target="_blank">Live Website</a>
        
    </footer>
    
</body>
</html>
