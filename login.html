<!DOCTYPE html>
<html>
<head>
    <title>Login - BookHub</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        .login-box {
            width: 500px;
            margin: 70px auto;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .row {
            display: flex;
            margin: 18px 0;
            align-items: center;
        }

        label {
            width: 170px;
            font-size: 18px;
        }

        input {
            width: 200px;
            height: 28px;
            border: 2px solid black;
        }

        .buttons {
            text-align: center;
            margin-top: 35px;
        }

        button {
            padding: 10px 25px;
            margin: 0 15px;
            font-size: 16px;
            background-color: white;
            border: 2px solid #555;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h2>Login Page</h2>

        <div class="row">
            <label>User Name:</label>
            <input type="text">
        </div>

        <div class="row">
            <label>Password:</label>
            <input type="password">
        </div>

        <div class="buttons">
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </div>

    </div>

</body>
</html>
