<!DOCTYPE html>
<html>
<head>
    <title>BookHub - Registration</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f5f5f5;
        }

        form {
            width: 500px;
            margin: 30px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid black;
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: inline-block;
            width: 150px;
            margin: 8px;
        }

        input, select, textarea {
            padding: 6px;
        }

        textarea {
            width: 200px;
            height: 60px;
        }

        .btn {
            margin-top: 15px;
            padding: 8px 20px;
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
            padding: 10px;
            background-color: #f6c18b;
            font-size: 14px;
            box-sizing: border-box;
        }
        
    </style>
</head>

<body>

<form>
    <h2>Registration Form</h2>

    <label>Name:</label>
    <input type="text" name="name"><br>

    <label>Password:</label>
    <input type="password" name="password"><br>

    <label>E-mail:</label>
    <input type="text" name="email"><br>

    <label>Phone Number:</label>
    <input type="text" name="phone"><br>

    <label>Sex:</label>
    <input type="radio" name="sex" value="male"> Male
    <input type="radio" name="sex" value="female"> Female
    <br>

    <label>Date of Birth:</label>

    <select>
        <option>Day</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
    </select>

    <select>
        <option>Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
    </select>

    <select>
        <option>Year</option>
        <option>2000</option>
        <option>2001</option>
        <option>2002</option>
    </select>
    <br>

    <label>Languages Known:</label>
    <input type="checkbox"> English
    <input type="checkbox"> Telugu
    <input type="checkbox"> Hindi
    <input type="checkbox"> Tamil
    <br>

    <label>Address:</label>
    <textarea></textarea>
    <br>

    <center>
        <input class="btn" type="submit" value="Register">
        <input class="btn" type="reset" value="Reset">
    </center>

</form>

<footer>

</footer> 

</body>
</html>
